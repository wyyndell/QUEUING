<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel Form</title>
<link rel="stylesheet" href="styles.css">
</head>
<style>
    /* Basic carousel form styles */

.carousel {
  width: 80%;
  max-width: 600px;
  margin: 0 auto;
  overflow: hidden;
  position: relative;
}

.carousel-container {
  display: flex;
  transition: transform 0.5s ease;
}

.carousel-item {
  flex: 0 0 100%; /* Each item occupies full width */
  padding: 20px;
  box-sizing: border-box;
}

.carousel-item form {
  max-width: 400px;
  margin: 0 auto;
}

.carousel-item h2 {
  text-align: center;
}

.carousel-prev,
.carousel-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  padding: 10px 20px;
  background-color: #333;
  color: white;
  border: none;
  cursor: pointer;
}

.carousel-prev {
  left: 10px;
}

.carousel-next {
  right: 10px;
}

</style>
<body>

<div class="carousel">
  <div class="carousel-container">
    <div class="carousel-item">
      <h2>Slide 1</h2>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </form>
    </div>
    <div class="carousel-item">
      <h2>Slide 2</h2>
      <form>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>
        
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>
      </form>
    </div>
    <div class="carousel-item">
      <h2>Slide 3</h2>
      <form>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>
        
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>
      </form>
    </div>
  </div>
  
  <button class="carousel-prev" onclick="changeSlide(-1)">Previous</button>
  <button class="carousel-next" onclick="changeSlide(1)">Next</button>
</div>

<script>
    const container = document.querySelector('.carousel-container');
const items = document.querySelectorAll('.carousel-item');
let currentIndex = 0;

function changeSlide(direction) {
  currentIndex = currentIndex + direction;
  
  if (currentIndex < 0) {
    currentIndex = items.length - 1;
  } else if (currentIndex >= items.length) {
    currentIndex = 0;
  }
  
  const itemWidth = items[0].offsetWidth;
  const offset = -itemWidth * currentIndex;
  container.style.transform = `translateX(${offset}px)`;
}

</script>
</body>
</html>
