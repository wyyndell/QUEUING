<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Example</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Modal */
        .modal-container {
            display: none; /* Initially hide modal */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            gap: 10px;
        }

        .modal-items {
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
            position: relative;
            width: 20%;
            max-width: 25%;
            height: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center items vertically */
            align-items: center; /* Center items horizontally */
        }

        .cnumber {
            width: 100px; /* Adjust width and height as needed */
            height: 100px; /* Equal width and height for a perfect circle */
            border-radius: 50%; /* Makes the element a circle */
            background-color: #FF914D; /* Background color */
            color: #fff; /* Text color */
            font-size: 40px; /* Font size */
            text-align: center; /* Center text horizontally */
            line-height: 100px; /* Center text vertically */
            margin-left: 60px;
            margin-right: 60px;
            padding: 10px;
            margin-bottom: 20px; /* Adjust spacing */
        }

        .cnumber h1 {
            margin: 0; /* Remove default margin */
        }

        .office {
            text-align: center; /* Center text in .office */
        }

        .office h2, .office p {
            margin: 0; /* Remove default margin */
        }

        .office {
            margin: 30px;
        }

        .office h2 {
            font-size: 50px;
        }
    </style>
</head>
<body>
    <button id="share">Share</button>

    <!-- Modal -->
    <div class="modal-container" id="modalContainer">
        <div class="modal-items">
            <div class="cnumber">
                <h1>12</h1>
            </div>
            <div class="office">
                <h2>Office</h2>
                <p>Name</p>
            </div>
        </div>

        <!-- Add more modal items as needed -->
        <div class="modal-items">
            <div class="cnumber">
                <h1>12</h1>
            </div>
            <div class="office">
                <h2>Office</h2>
                <p>Name</p>
            </div>
        </div>

        <div class="modal-items">
            <div class="cnumber">
                <h1>12</h1>
            </div>
            <div class="office">
                <h2>Office</h2>
                <p>Name</p>
            </div>
        </div>
    </div>

    <script>
        // Get the share button
        const shareButton = document.getElementById('share');

        // Get the modal container
        const modalContainer = document.getElementById('modalContainer');

        // Add click event listener to share button
        shareButton.addEventListener('click', function() {
            // Display the modal container when share button is clicked
            modalContainer.style.display = 'flex';
        });
    </script>
</body>
</html>
